spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:subscription_manager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

api:
  base-path: /api/v1

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  notifications:
    renewal-reminder-days: ${RENEWAL_REMINDER_DAYS:7}
    trial-reminder-days: ${TRIAL_REMINDER_DAYS:3}
    scheduler-initial-delay-ms: ${NOTIFICATIONS_SCHEDULER_INITIAL_DELAY_MS:10000}
    scheduler-interval-ms: ${NOTIFICATIONS_SCHEDULER_INTERVAL_MS:86400000}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deployment-32bytes+}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
